name: Build & deploy to GitHub Pages
on:
  push:
    branches: [master]
  schedule:
    - cron: "30 8 * * *"   # nightly 04:30 ET
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # keepalive below
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: ./deploy/assemble.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub pauses scheduled workflows after 60 days without repo activity (it happened
      # on 2026-10-27). Re-enabling the workflow from inside the nightly run keeps it alive.
      - name: Keep the nightly schedule alive
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
